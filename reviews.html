<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusHub Academy-Reviews</title>
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="nightmode.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            transition: 0.3s ease-out;
        }

        article {
            color: rgb(43, 5, 5);
            width: 100%;
            overflow-x: hidden;
            transition: 0.3s ease-out;
        }

        .section_breaker {
            height: 50px;
        }

        /* Sticky Form Wrapper Fix */
        .sticky-form-container {
            position: sticky;
            top: 80px;
            /* Offset to clear header bar height */
            z-index: 900;
            max-width: 600px;
            margin: 20px auto 30px auto;
            padding: 0 15px;
            z-index: 1;
        }

        .form-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9ecef;
            z-index: 1;
        }

        .form-card h2 {
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: #212529;
        }

        #reviewForm {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #0d6efd;
        }

        #reviewForm button {
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #reviewForm button:hover {
            background-color: #0b5ed7;
        }

        /* Reviews List Section */
        .reviews-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .reviews-wrapper h2 {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 15px;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .review-card {
            background-color: #ffffff;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #0d6efd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            z-index: 1;
        }


        .nightbody main .review_card hr{
            display: block;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .review-author {
            font-weight: 600;
            color: #343a40;
        }

        .review-date {
            font-size: 0.8rem;
            color: #8c98a4;
        }

        .review-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #495057;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        #reviewForm button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Footer */
        footer {
            text-align: center;
        }

        /* Night Mode Overrides */
        .nightbody article {
            color: white;
        }

        .nightbody .form-card,
        .nightbody .review-card {
            background-color: #2b3035;
            border-color: #373b3e;
            color: #ffffff;
            box-shadow: 0 0 6px white, 0 0 6px white;
        }

        .nightbody .form-card h2,
        .nightbody .review-author,
        .nightbody .review-text {
            color: #f8f9fa;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <h1>NexusHub Academy</h1>
            <div id="nav_button">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                    <li><a href="courses.html">See Courses</a></li>
                    <li class="current_site"><a href="">Reviews</a></li>
                    <li><a href="guide.html">Help</a></li>
                </ul>
            </div>
            <button class="sidetoggle" id="sidetoggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <div class="sidebarcontainer" id="sidebarcontainer">
        <aside class="sidebar" id="sidebar">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="contacts.html">CONTACTS</a></li>
                <li><a href="courses.html">SEE COURSES</a></li>
                <li id="current_site"><a href="">REVIEWS</a></li>
                <li><a href="guide.html">HELP</a></li>
            </ul>
        </aside>
    </div>

    <main>
        <div class="mode_container">
            <button class="mode_button" onclick="mode_change()" id="mode_button">
                <img src="daymode.png" alt="" id="mode_image">
                <h3>DAY MODE</h3>
            </button>
        </div>

        <section class="sticky-form-container">
            <div class="form-card">
                <h2>Leave a Review</h2>
                <form id="reviewForm">
                    <div class="form-group">
                        <input type="text" id="username" placeholder="Your Name" required />
                    </div>
                    <div class="form-group">
                        <textarea id="reviewText" placeholder="Write your review here..." rows="3" required></textarea>
                    </div>
                    <button type="submit" id="submitBtn">Submit Review</button>
                </form>
            </div>
        </section>

        <div class="reviews-wrapper">
            <h2>Community Reviews</h2>
            <div id="reviewsContainer" class="reviews-list">
            </div>
        </div>
    </main>

    <div class="section_breaker"></div>
    <hr>
    <div class="section_breaker"></div>

    <footer>
        &copy;2026 NexusHub Academy - All rights reserved
    </footer>

    <div class="section_breaker"></div>

    <script>
        const sidetoggle = document.getElementById("sidetoggle");
        const sidebar = document.getElementById("sidebar");

        sidetoggle.addEventListener("click", () => {
            sidetoggle.classList.toggle("active");
            sidebar.classList.toggle("active");
        })
    </script>
    <script>
        let mode = localStorage.getItem("nexushub_academy_display_mode");
        const image = document.getElementById("mode_image");
        const mode_button = document.getElementById("mode_button");
        const main = document.querySelector("main");


        if (mode === "night") {
            document.body.classList.add("nightbody");
            image.src = "nightmode.png";
            mode_button.classList.add("mode_button_night");
            mode_button.querySelector("h3").innerText = "NIGHT MODE";
        } else {
            document.body.classList.remove("nightbody");
            image.src = "daymode.png";
            mode_button.classList.remove("mode_button_night");
            mode_button.querySelector("h3").innerText = "DAY MODE";
        }


        function mode_change() {
            let currentMode = localStorage.getItem("nexushub_academy_display_mode");


            if (currentMode !== "night") {
                document.body.classList.add("nightbody");
                localStorage.setItem("nexushub_academy_display_mode", "night");
                image.src = "nightmode.png";
                mode_button.classList.add("mode_button_night");
                mode_button.querySelector("h3").innerText = "NIGHT MODE";
            } else {

                document.body.classList.remove("nightbody");
                localStorage.setItem("nexushub_academy_display_mode", "day");
                image.src = "daymode.png";
                mode_button.classList.remove("mode_button_night");
                mode_button.querySelector("h3").innerText = "DAY MODE";
            }
        }
    </script>

    <script>
        const reviewForm = document.getElementById('reviewForm');
        const reviewsContainer = document.getElementById('reviewsContainer');

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        async function fetchReviews() {
            try {
                const response = await fetch('https://nexushub-academy-server.onrender.com/api/reviews');
                if (!response.ok) throw new Error('Failed to fetch');
                const data = await response.json();

                const reviews = data ? Object.values(data) : [];

                reviewsContainer.innerHTML = '';

                if (reviews.length === 0) {
                    reviewsContainer.innerHTML = '<p class="no-reviews">No reviews yet. Be the first to add one!</p>';
                    return;
                }

                reviews.forEach(review => {
                    const card = document.createElement('article');
                    card.className = 'review-card';

                    card.innerHTML = `
                        <div class="review-header">
                          <span class="review-author">${escapeHtml(review.username)}</span>
                          </div>
                        
                        <p class="review-text">${escapeHtml(review.review_text)}</p>
                    `;

                    reviewsContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching reviews:", error)
                reviewsContainer.innerHTML = '<p class="error">Unable to load reviews right now.</p>';
            }
        }

        reviewForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const review_text = document.getElementById('reviewText').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (!username || !review_text) return;

            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Submitting...';

            try {
                const response = await fetch('https://nexushub-academy-server.onrender.com/api/send_reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, review_text })
                });

                if (response.ok) {
                    alert("Thank you for your review! It has been submitted successfully.");
                    reviewForm.reset();
                    fetchReviews();
                }
            } catch (error) {
                console.error('Error posting review:', error);
            } finally {
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Submit Review';
            }
        });

        fetchReviews();
    </script>
</body>

</html>
