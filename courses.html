<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusHub Academy-Courses</title>
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="nightmode.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }



        /* main content  */

        body {
            transition: 0.3s ease-out;
        }


        main {
            padding: 20px;
        }


        .section_breaker {
            height: 50px;
        }


        /* course cards */


        .card_container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .card {
            width: 400px;
            max-width: 90vw;
            background: #f1f1f1;
            border-radius: 12px;
            box-shadow: 9px 9px 6px rgba(0, 0, 0, 0.1);
            z-index: 995;
            height: 450px;
            padding-bottom: 25px;
            border: 0.5px solid rgb(128, 128, 128);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 1;
            color: black;
            transition: 0.3s ease-out;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 70%;
            display: block;
            border-radius: 8px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0;
            margin-top: 10px;
        }

        .card-price {
            margin-top: 15px;
        }

        .cut {
            text-decoration: line-through;
        }

        .course_enroll {
            width: 160px;
            background-color: orangered;
            height: 50px;
            border-radius: 32px;
            font-size: large;
            font-weight: bold;
            color: white;
            display: block;
            margin: 20px auto;
            margin-top: 30px;
            margin-bottom: 5px;
        }



        /* footer */

        footer {
            text-align: center;
        }


        /* dark mode  */

        .nightbody article {
            color: white;
        }

        .nightbody .card {
            box-shadow: 0 0 5px white, 0 0 5px white;
        }

        .nightbody .card:hover {
            box-shadow: 0 0 8px white, 0 0 8px white;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <h1>NexusHub Academy</h1>
            <div id="nav_button">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                    <li class="current_site"><a href="">See Courses</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                </ul>
            </div>
            <button class="sidetoggle" id="sidetoggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>
    <div class="sidebarcontainer" id="sidebarcontainer">
        <aside class="sidebar" id="sidebar">
            <ul>
                <li>
                    <a href="index.html">HOME</a>
                </li>
                <li>
                    <a href="contacts.html">
                        CONTACTS
                    </a>
                </li>
                <li id="current_site">
                    <a href="">
                        SEE COURSES
                    </a>
                </li>
                <li>
                    <a href="reviews.html">
                        REVIEWS
                    </a>
                </li>
            </ul>
        </aside>
    </div>
    <script>
        const sidetoggle = document.getElementById("sidetoggle");
        const sidebar = document.getElementById("sidebar");

        sidetoggle.addEventListener("click", () => {
            sidetoggle.classList.toggle("active");
            sidebar.classList.toggle("active");
        })
    </script>
    <main>
        <div class="mode_container">
            <button class="mode_button" onclick="mode_change()" id="mode_button">
                <img src="daymode.png" alt="" id="mode_image">
                <h3>Day Mode</h3>
            </button>
        </div>
        <div class="card_container">

            <div class="card">

                <img src="course_cover/card_thumbnail.png" alt="Frontend Web Development">
                <div class="card-content">
                    <h2 class="card-title">Frontend Web Development</h2>
                    <p class="card-price">Course Price: $10 <span class="cut">$70</span></p>
                    <button class="course_enroll" onclick="alert('This Functionality is still under development')">Enroll</button>
                </div>
            </div>
            <div class="card">

                <img src="course_cover/card_thumbnail.png" alt="AI Engineering">
                <div class="card-content">
                    <h2 class="card-title">AI Engineering</h2>
                    <p class="card-price">Course Price: $30 <span class="cut">$120</span></p>
                    <button class="course_enroll" onclick="alert('This Functionality is still under development')">Enroll</button>
                </div>
            </div>
        </div>
    </main>
    <div class="section_breaker"></div>
    <hr>
    <div class="section_breaker"></div>
    <footer>
        &copy;2026 NexusHub Academy - All rights reserved
    </footer>
    <div class="section_breaker"></div>
    <script>
        let mode = localStorage.getItem("nexushub_academy_display_mode");
        const image = document.getElementById("mode_image");
        const mode_button = document.getElementById("mode_button");
        const main = document.querySelector("main");


        if (mode === "night") {
            document.body.classList.add("nightbody");
            image.src = "nightmode.png";
            mode_button.classList.add("mode_button_night");
            mode_button.querySelector("h3").innerText = "NIGHT MODE";
        } else {
            document.body.classList.remove("nightbody");
            image.src = "daymode.png";
            mode_button.classList.remove("mode_button_night");
            mode_button.querySelector("h3").innerText = "DAY MODE";
        }


        function mode_change() {
            let currentMode = localStorage.getItem("nexushub_academy_display_mode");


            if (currentMode !== "night") {
                document.body.classList.add("nightbody");
                localStorage.setItem("nexushub_academy_display_mode", "night");
                image.src = "nightmode.png";
                mode_button.classList.add("mode_button_night");
                mode_button.querySelector("h3").innerText = "NIGHT MODE";
            } else {

                document.body.classList.remove("nightbody");
                localStorage.setItem("nexushub_academy_display_mode", "day");
                image.src = "daymode.png";
                mode_button.classList.remove("mode_button_night");
                mode_button.querySelector("h3").innerText = "DAY MODE";
            }
        }
    </script>
</body>

</html>
