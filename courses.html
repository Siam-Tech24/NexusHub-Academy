<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="nightmode.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* main section */
        body {
            transition: 0.3s ease-out;
        }

        /* Reviews List Section */
        .reviews-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .reviews-wrapper h2 {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 15px;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .request-card {
            background-color: #ffffff;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #0d6efd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            z-index: 1;
            color: black;
        }

        .request-card p {
            margin: 10px;
        }

        .request-card h2 {
            margin: 10px;
        }

        .approve-btn {
            margin: 10px;
            padding: 8px 16px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .approve-btn:hover {
            background-color: #157347;
        }

        .approve-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }


        .reject-btn {
            margin: 10px;
            padding: 8px 16px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .reject-btn:hover {
            background-color: #157347;
        }

        .reject-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }



        .nightbody main .review_card hr {
            display: block;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .review-author {
            font-weight: 600;
            color: #343a40;
        }

        .review-date {
            font-size: 0.8rem;
            color: #8c98a4;
        }

        .request-text {
            line-height: 1.5;
            color: #495057;
        }

        .bold_text {
            font-size: large;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <h1>NexusHub Academy-Admin Panel</h1>
            <div id="nav_button">
                <ul>
                    <li class="current_site"><a href="index.html">Home</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                    <li><a href="courses.html">See Courses</a></li>
                    <li><a href="requests.html">Reviews</a></li>
                    <li><a href="guide.html">Help</a></li>
                </ul>
            </div>
            <button class="sidetoggle" id="sidetoggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>
    <div class="sidebarcontainer" id="sidebarcontainer">
        <aside class="sidebar" id="sidebar">
            <ul>
                <li id="current_site">
                    <a href="index.html">HOME</a>
                </li>
                <li>
                    <a href="contacts.html">
                        CONTACTS
                    </a>
                </li>
                <li>
                    <a href="courses.html">
                        SEE COURSES
                    </a>
                </li>
                <li>
                    <a href="requests.html">
                        REVIEWS
                    </a>
                </li>
                <li>
                    <a href="guide.html">
                        HELP
                    </a>
                </li>
            </ul>
        </aside>
    </div>
    <script>
        const sidetoggle = document.getElementById("sidetoggle");
        const sidebar = document.getElementById("sidebar");

        sidetoggle.addEventListener("click", () => {
            sidetoggle.classList.toggle("active");
            sidebar.classList.toggle("active");
        })
    </script>
    <main>
        <div class="mode_container">
            <button class="mode_button" onclick="mode_change()" id="mode_button">
                <img src="daymode.png" alt="" id="mode_image">
                <h3>DAY MODE</h3>
            </button>
        </div>
        <div class="reviews-wrapper">
            <h2>Requests: </h2>
            <div id="reviewsContainer" class="reviews-list">
            </div>
        </div>
    </main>
    <script>
        let mode = localStorage.getItem("nexushub_academy_display_mode");
        const image = document.getElementById("mode_image");
        const mode_button = document.getElementById("mode_button");
        const main = document.querySelector("main");


        if (mode === "night") {
            document.body.classList.add("nightbody");
            image.src = "nightmode.png";
            mode_button.classList.add("mode_button_night");
            mode_button.querySelector("h3").innerText = "NIGHT MODE";
        } else {
            document.body.classList.remove("nightbody");
            image.src = "daymode.png";
            mode_button.classList.remove("mode_button_night");
            mode_button.querySelector("h3").innerText = "DAY MODE";
        }


        function mode_change() {
            let currentMode = localStorage.getItem("nexushub_academy_display_mode");


            if (currentMode !== "night") {
                document.body.classList.add("nightbody");
                localStorage.setItem("nexushub_academy_display_mode", "night");
                image.src = "nightmode.png";
                mode_button.classList.add("mode_button_night");
                mode_button.querySelector("h3").innerText = "NIGHT MODE";
            } else {

                document.body.classList.remove("nightbody");
                localStorage.setItem("nexushub_academy_display_mode", "day");
                image.src = "daymode.png";
                mode_button.classList.remove("mode_button_night");
                mode_button.querySelector("h3").innerText = "DAY MODE";
            }
        }
    </script>
    <script>



        const reviewsContainer = document.getElementById('reviewsContainer');

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }


        async function rejectRequest(requestData, buttonElement) {
            const confirmed = confirm(
                `Reject enrollment from ${requestData.fullname}?`
            );

            if (!confirmed) return;

            buttonElement.disabled = true;
            buttonElement.innerText = 'Rejecting...';

            try {
                const response = await fetch(
                    'https://nexushub-academy-server.onrender.com/api/reject',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            id: requestData.id
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error('Rejection failed');
                }

                buttonElement.innerText = 'Rejected';
                buttonElement.style.backgroundColor = '#6c757d';

            } catch (error) {
                console.error("Error rejecting request:", error);

                alert('Failed to reject request. Please try again.');

                buttonElement.disabled = false;
                buttonElement.innerText = 'Reject';
            }
        }

        async function approveRequest(requestData, buttonElement) {
            buttonElement.disabled = true;
            buttonElement.innerText = 'Approving...';

            try {
                const response = await fetch('https://nexushub-academy-server.onrender.com/api/approve', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) throw new Error('Approval failed');

                buttonElement.innerText = 'Approved!';
                buttonElement.style.backgroundColor = '#6c757d';
            } catch (error) {
                console.error("Error approving request:", error);
                alert('Failed to approve request. Please try again.');
                buttonElement.disabled = false;
                buttonElement.innerText = 'Approve';
            }
        }

        async function fetchReviews() {
            try {
                const response = await fetch('https://nexushub-academy-server.onrender.com/api/request');
                if (!response.ok) throw new Error('Failed to fetch');
                const data = await response.json();

                const requests = data
                    ? Object.entries(data).map(([id, request]) => ({
                        id,
                        ...request
                    }))
                    : [];

                reviewsContainer.innerHTML = '';

                if (requests.length === 0) {
                    reviewsContainer.innerHTML = '<p class="no-requests">No requests yet!</p>';
                    return;
                }

                requests.forEach(request => {
                    const card = document.createElement('article');
                    card.className = 'request-card';

                    card.innerHTML = `
                        <p class="request-text"><span class="bold_text">Name:</span> ${escapeHtml(request.fullname)}</p>
                        <p class="request-text"><span class="bold_text">Country:</span> ${escapeHtml(request.country)}</p>
                        <p class="request-text"><span class="bold_text">WhatsApp:</span> <a href="https://wa.me/${escapeHtml(request.whatsapp)}">${escapeHtml(request.whatsapp)}</a></p>
                        <p class="request-text"><span class="bold_text">Email:</span> ${escapeHtml(request.email)}</p>
                        <p class="request-text"><span class="bold_text">Course:</span> ${escapeHtml(request.course)}</p>
                        <button class="approve-btn">Approve</button>
                        <button class="reject-btn">Reject</button>
                    `;

                    const approveBtn = card.querySelector('.approve-btn');
                    approveBtn.addEventListener('click', () => approveRequest(request, approveBtn));

                    const rejectBtn = card.querySelector('.reject-btn');

                    rejectBtn.addEventListener('click', () => rejectRequest(request, rejectBtn));

                    reviewsContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching requests:", error);
                reviewsContainer.innerHTML = '<p class="error">Unable to load requests right now.</p>';
            }
        }

        fetchReviews();
    </script>
</body>

</html>
