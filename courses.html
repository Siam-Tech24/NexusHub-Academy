<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* main content  */

        body {
            transition: 0.3s ease-out;
        }

        main {
            padding: 20px;
        }

        .section_breaker {
            height: 50px;
        }

        /* course cards */

        .card_container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .card {
            width: 400px;
            max-width: 90vw;
            background: #f1f1f1;
            border-radius: 12px;
            box-shadow: 9px 9px 6px rgba(0, 0, 0, 0.1);
            z-index: 1;
            height: 450px;
            padding-bottom: 25px;
            border: 0.5px solid rgb(128, 128, 128);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 1;
            color: black;
            transition: 0.3s ease-out;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 70%;
            display: block;
            border-radius: 8px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0;
            margin-top: 10px;
        }

        .card-price {
            margin-top: 15px;
        }

        .cut {
            text-decoration: line-through;
        }

        .course_enroll {
            width: 160px;
            background-color: orangered;
            height: 50px;
            border-radius: 32px;
            font-size: large;
            font-weight: bold;
            color: white;
            display: block;
            margin: 20px auto;
            margin-top: 30px;
            margin-bottom: 5px;
            border: none;
            cursor: pointer;
        }

        /* footer */

        footer {
            text-align: center;
        }

        /* dark mode  */

        .nightbody article {
            color: white;
        }

        .nightbody .card {
            box-shadow: 0 0 5px white, 0 0 5px white;
        }

        .nightbody .card:hover {
            box-shadow: 0 0 8px white, 0 0 8px white;
        }

        /* enroll form overlay */

        .form_container {
            height: 100vh;
            width: 100vw;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99999;
            position: fixed;
            top: 0;
            left: 0;
            justify-content: center;
            align-items: center;
            display: none;
        }

        .form_container.active {
            display: flex;
        }

        .enroll_form {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: #333;
        }

        .enroll_form h2 {
            margin-bottom: 5px;
            color: #111;
        }

        .form_group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .form_group label {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .form_group input,
        .form_group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: white;
        }

        .form_group input:focus,
        .form_group select:focus {
            outline: none;
            border-color: orangered;
        }


        .phone_input_container {
            display: flex;
            gap: 10px;
        }

        .phone_input_container select {
            width: 120px;
            flex-shrink: 0;
        }

        .phone_input_container input {
            flex-grow: 1;
        }

        .close_btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            color: #666;
        }

        .form_group p {
            color: black;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: white;
        }

        .submit_btn {
            background-color: orangered;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit_btn:hover {
            background-color: #e03e00;
        }
    </style>
</head>

    <script>

        const sidetoggle = document.getElementById("sidetoggle");
        const sidebar = document.getElementById("sidebar");

        sidetoggle.addEventListener("click", () => {
            sidetoggle.classList.toggle("active");
            sidebar.classList.toggle("active");
        });


        let mode = localStorage.getItem("nexushub_academy_display_mode");
        const image = document.getElementById("mode_image");
        const mode_button = document.getElementById("mode_button");

        if (mode === "night") {
            document.body.classList.add("nightbody");
            image.src = "nightmode.png";
            mode_button.classList.add("mode_button_night");
            mode_button.querySelector("h3").innerText = "NIGHT MODE";
        } else {
            document.body.classList.remove("nightbody");
            image.src = "daymode.png";
            mode_button.classList.remove("mode_button_night");
            mode_button.querySelector("h3").innerText = "DAY MODE";
        }

        function mode_change() {
            let currentMode = localStorage.getItem("nexushub_academy_display_mode");

            if (currentMode !== "night") {
                document.body.classList.add("nightbody");
                localStorage.setItem("nexushub_academy_display_mode", "night");
                image.src = "nightmode.png";
                mode_button.classList.add("mode_button_night");
                mode_button.querySelector("h3").innerText = "NIGHT MODE";
            } else {
                document.body.classList.remove("nightbody");
                localStorage.setItem("nexushub_academy_display_mode", "day");
                image.src = "daymode.png";
                mode_button.classList.remove("mode_button_night");
                mode_button.querySelector("h3").innerText = "DAY MODE";
            }
        }


        const formContainer = document.getElementById("form_container");
        const enrollForm = document.getElementById("enroll_form");

        function updateCountryCode() {
            const countrySelect = document.getElementById("country");
            const countryCodeSelect = document.getElementById("country_code");
            countryCodeSelect.value = countrySelect.value;
        }

        function openForm(name) {
            formContainer.classList.add("active");
            document.getElementById("course_name").innerText = name;
        }

        function closeForm() {
            formContainer.classList.remove("active");
        }

        enrollForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const code = document.getElementById("country_code").value;
            const phone = document.getElementById("whatsapp").value;
            alert(`Thank you for registering! We will contact you via WhatsApp at ${code}${phone} shortly.`);
            enrollForm.reset();
            updateCountryCode();
            closeForm();
        });
    </script>
